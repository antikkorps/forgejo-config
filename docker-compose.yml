# Versions: pinned to major. When you add Renovate, switch to minor pins
# (e.g. forgejo:10.1) and let Renovate propose bumps. Postgres major upgrades
# (16 -> 17) are NEVER auto-safe — they require a manual dump+restore.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:10
    container_name: forgejo
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: ${POSTGRES_DB}
      FORGEJO__database__USER: ${POSTGRES_USER}
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD}
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__ROOT_URL: https://${FORGEJO_DOMAIN}/
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__SSH_PORT: "22"
      # The official image already runs OpenSSH on :22 with the proper
      # AuthorizedKeysCommand wired to Forgejo. Forgejo's built-in Go SSH
      # server must stay off, otherwise both fight for :22 and crash.
      # Must be explicitly "false" — once written to app.ini at install,
      # removing the env var alone does not unset it.
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtps
      FORGEJO__mailer__SMTP_ADDR: smtp.resend.com
      FORGEJO__mailer__SMTP_PORT: "465"
      FORGEJO__mailer__USER: resend
      FORGEJO__mailer__PASSWD: ${RESEND_API_KEY}
      FORGEJO__mailer__FROM: ${MAIL_FROM}
    volumes:
      - ./data/forgejo:/var/lib/gitea
      - ./data/forgejo-config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "22:22"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - internal
      - web

  postgres:
    image: postgres:16-alpine
    container_name: forgejo-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: forgejo-caddy
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: forgejo-cloudflared
    restart: unless-stopped
    logging: *default-logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - web

  # Forgejo Actions runner (light CI on the VM).
  # Heavy jobs (Zap, SonarCloud) run on the home server with a separate runner.
  runner:
    image: code.forgejo.org/forgejo/runner:6
    container_name: forgejo-runner
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      forgejo:
        condition: service_healthy
    user: "1000:1000"
    # GID of the host's `docker` group, so the runner can talk to docker.sock.
    # Check on the host: `getent group docker` and adjust if it differs.
    group_add:
      - "988"
    environment:
      FORGEJO_INSTANCE_URL: http://forgejo:3000
    volumes:
      - ./data/runner:/data
      - ./runner/config.yml:/data/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: forgejo-runner daemon --config /data/config.yml
    deploy:
      resources:
        limits:
          memory: 1500M
    networks:
      - internal
      - web

volumes:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
  web:
    driver: bridge

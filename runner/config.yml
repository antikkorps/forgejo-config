# Forgejo Actions runner config.
# Docs: https://forgejo.org/docs/latest/admin/actions/

log:
  level: info

runner:
  file: .runner
  # One job at a time: every job shares the `internal` Docker network, so two
  # concurrent jobs with a same-named service (e.g. a `testdb` Postgres) would
  # resolve each other's containers. Raise only once jobs get their own network.
  capacity: 1
  timeout: 1h
  shutdown_timeout: 30s
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "docker:docker://node:24-bookworm"
    - "ubuntu-latest:docker://node:24-bookworm"

cache:
  enabled: true
  dir: /data/cache

container:
  # Compose names networks <project>_<network>; the project name is pinned to
  # `forgejo-config` in docker-compose.yml, so this matches on every machine.
  network: forgejo-config_internal
  privileged: false
  options: ""
  workdir_parent: /workspace
  valid_volumes: []
  docker_host: "unix:///var/run/docker.sock"
  force_pull: false

host:
  workdir_parent: /workspace

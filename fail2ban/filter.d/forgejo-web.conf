# Forgejo web auth failure filter.
# Matches the log lines Forgejo emits for failed sign-ins and token abuse.

[Definition]
failregex = ^.*Failed authentication attempt for .* from <HOST>.*$
            ^.*invalid credentials.*from <HOST>.*$
            ^.*Authorization failed for user .* from <HOST>.*$
            ^.*\] RemoteAddr: <HOST>.* (?:Login|TwoFactor|WebAuthn).*failed.*$

ignoreregex =
